<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title> для аришки ❤️❤️❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭТАП 1 -->
<section id="stage1" class="stage active">
  <div class="center">
    <img src="heart.png" id="heart" class="heart">

    <div id="after-heart" class="after-heart hidden">
      <img src="bouquet.png" class="bouquet">

      <div class="envelope-wrapper">
        <img src="envelope.png" id="envelope" class="envelope">
        <div class="tap-ring"></div>
      </div>
    </div>
  </div>
</section>

<!-- ЭТАП 2 -->
<section id="stage2" class="stage">
  <div class="letter-center">
    <div class="paper">
      <div id="letter-text" class="letter-text"></div>
    </div>
  </div>
  <button id="to-stage3" class="next-btn">Дальше</button>
</section>

<!-- ЭТАП 3 -->
<section id="stage3" class="stage">
  <h1 class="stage3-title">Ты у меня самая</h1>
  <div id="compliments-container"></div>
  <button id="more-btn" class="next-btn stage3-btn">ещё</button>
</section>

<!-- ПОЦЕЛУЙ -->
<div id="kiss" class="kiss hidden">
  <img src="lip.png">
</div>

<!-- ЭТАП 4 -->
<section id="stage4" class="stage">

  <div class="stage4-wrapper">

    <h2 class="stage4-title">
      С нашего первого поцелуя прошло уже
    </h2>

    <div class="stage4-content">

      <img src="kiss-left.jpg" class="side-photo left-photo">

      <div id="timer" class="timer"></div>

      <img src="kiss-right.jpg" class="side-photo right-photo">

    </div>

    <button id="to-stage5" class="riechka-btn">
      <img src="riechka.png">
    </button>

  </div>

</section>


<!-- ЭТАП 5 ИГРА -->
<section id="stage5" class="stage">
  <div id="counter">Найдено 0/10 риечек</div>
  <div id="gameArea"></div>
</section>

<!-- ЭТАП 6 -->
<section id="stage6" class="stage">
  <div class="stage6-center">

    <h2 class="stage6-title">ты мое солнышко</h2>

    <img src="sunsystem.gif" class="solar">

    <button id="to-stage7" class="next-btn show">Дальше</button>

  </div>
</section>


<!-- ЭТАП 7 -->

<section id="stage8" class="stage">

  <div class="final-screen">
    <img src="final/final1.jpg">
    <img src="final/final2.jpg">
    <h1 class="love-text">я люблю тебя котенок</h1>
  </div>



<!-- ЭТАП 8 -->


</section>

<script src="script.js"></script>
</body>
